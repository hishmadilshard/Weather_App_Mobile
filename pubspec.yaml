name: weather_app
description: A beautiful weather application using Clean Architecture
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  lottie: ^2.7.0
  syncfusion_flutter_charts: ^24.1.46
  google_fonts: ^6.1.0
  geolocator: ^11.0.1
  permission_handler: ^11.0.1
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  dio: ^5.4.0
  cached_network_image: ^3.3.0
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.9
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300